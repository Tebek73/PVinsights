<div class="feasibility-gauge" role="img" [attr.aria-label]="ariaLabel()">
  <div class="feasibility-gauge-inner">
    <svg class="feasibility-svg" viewBox="0 0 100 100" aria-hidden="true">
      <path
        class="feasibility-track"
        fill="none"
        stroke-width="9"
        pathLength="100"
        [attr.d]="arcPath"
      />
      <path
        class="feasibility-fill"
        fill="none"
        stroke-width="9"
        stroke-linecap="round"
        pathLength="100"
        [attr.d]="arcPath"
        [attr.stroke]="bandColor()"
        [attr.stroke-dasharray]="dashArray()"
      />
    </svg>
    <div class="feasibility-center">
      <span class="feasibility-score-num">{{ feasibility().score }}</span>
      <span class="feasibility-score-max">/100</span>
    </div>
  </div>
  <div class="feasibility-caption-row">
    <span class="feasibility-title">{{ 'results.feasibilityScore' | translate }}</span>
    <app-info-tooltip explanationKey="results.explainFeasibilityScore" />
  </div>
  <p class="feasibility-disclaimer">{{ 'results.feasibilityDisclaimer' | translate }}</p>
</div>
